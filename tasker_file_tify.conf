# 重命名收藏视频
/__我的文件/收藏视频
    # 重命名下载的哔哩哔哩视频并写入链接和替换视频封面
    match: BV([0-9a-z]{4,})_
    action: rename
        replace: BV([0-9a-z]{4,})_
        with:
    action: command
        cmd: video-add-file {}
    # 将 bv 号写入文件中, 方便重新下载视频
    action: append
        text: \1
        file: .voide.link


