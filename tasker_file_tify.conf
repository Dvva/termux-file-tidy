# 同人图
/__我的文件/同人图*
    # 只处理还没加 __ 前缀的，保证重复运行不会叠加前缀
    match: ^(?!__)
    # pixiv 默认下载格式: {作者ID}_{年月日时}_{作品ID}
    # 对非 pixiv 下载的图片如小红书, 微博, 推特, 哔哩哔哩, 添加 __ 前缀使其归并在一起
    exclude: [0-9]{5,}_[0-9]{10}_[0-9]{6,}
    action: rename
        prefix: __


