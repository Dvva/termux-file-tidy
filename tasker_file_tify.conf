# 收藏视频：写入 B 站封面、记录 BV 号，再把 BV 号从文件名里去掉
/__我的文件/收藏视频
    # 封面嵌入和记录由 bili-fix 完成，改名由下面的 rename 完成
    # 用 python3 显式调用，避免同步后丢失执行权限
    # BV 号含大小写字母，不能写成 [0-9a-z]
    match: BV[0-9A-Za-z]{10}
    action: command
        cmd: python3 $HOME/termux-file-tidy/bin/bili-fix {}
    action: rename
        # 开头：BVxxx_标题
        replace: ^BV[0-9A-Za-z]{10}_
        with:
        # 结尾：标题_BVxxx
        replace: _BV[0-9A-Za-z]{10}$
        with:
        # 中间：标题_BVxxx_副标题
        replace: _BV[0-9A-Za-z]{10}_
        with: _


# 重命名配置文件
/_备份文件/_应用配置/___格式化名字
