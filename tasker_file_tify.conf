# 复制同步文件
# ========================================
# ========================================


# TODO 下面四行的括号是目录名的一部分还是想写正则？请确认
/__我的文件/(教程)
/__我的文件/(知识)
/__我的文件/(收藏)
/__我的文件/_归档文件/(游戏攻略)
    # 对非备份文件添加 __ 前缀
    exclude: [^_]+[^_]+[^_]+
    action: rename
        prefix: __
    # 归档备份文件
    action: copy
        match: [^_]+[^_]+[^_]+
        to: /_同步文件/罐装知识/\1


# 梗图、表情包按时间戳重命名
/__我的文件/_归档文件/梗图*
/__我的文件/_归档文件/表情包*
    action: rename
        to: {timestamp}.{ext}


# 同人图
/__我的文件/同人图*
    # pixiv 默认下载格式: {作者ID}_{年月日时}_{作品ID}
    # 对非 pixiv 下载的图片如小红书, 微博, 推特, 哔哩哔哩, 添加 __ 前缀使其归并在一起
    exclude: [0-9]{5,}_[0-9]{10}_[0-9]{6,}
    action: rename
        prefix: __


# 收尾命令
