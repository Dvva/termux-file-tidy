# 收尾命令
# ========================================
# ========================================

# 合并剩下的图片
/DCIM/
/Pictures
/Download
/Download/1DM
    /Download/下载文件
    match: \.(jpg|png|jpeg|webp|mp4|flv)
    depth: 1


# 长图拼接大师生成的图（13 位毫秒时间戳命名，如 1782321803679.jpg）
# 统一成小米相册格式 IMG_20251019_174902.jpg，方便按名字排序
/__我的文件/相册
    # 只处理纯数字名，已经是 IMG_ 开头的不要重复改名
    match: ^[0-9]{13}\.
    action: rename
        to: IMG_{mtime:%Y%m%d_%H%M%S}.{ext}

# 书籍文件仅保留云端书籍（去重，主目录 = 坚果云同步的 Cloud）
# 同名 + 同大小 + 同哈希才算重复；保留主目录那份，其余移到 _重复文件/<时间戳>/
/Books/
    action: dedupe
        keep: /Books/Cloud

# 压缩并替换同人图：仅降低清晰度，不修改尺寸（不写 max_edge 就不缩放）
# 仅当压缩后体积变小才替换原文件
# limit 是定时任务一次最多压几个；preserve_time 保留原文件的修改/访问时间
/__我的文件/同人图*
    action: compress-image
        quality: 5
        limit: 100
        # 保留文件
        preserve_time: true


# 压缩并替换音乐，统一转成 mp3 320k，仅当压缩后体积变小才替换原文件
/__我的文件/_归档文件/音乐
    action: compress-music
        format: mp3
        bitrate: 320k
        limit: 10
        preserve_time: true


# 压缩收藏视频：按视频网站口径分档，resolution: 1080p = 短边 1080
# 只降不升：本来就是 720p 的不会被放大，宽高比不变
# crf 越小越清晰（18-28 常用）；压完没变小就保留原文件；非视频文件自动跳过
# 视频最慢，定时任务一次只压 2 个，剩下的下次接着做
/__我的文件/收藏视频
    action: compress-video
        resolution: 1080p
        crf: 23
        limit: 2
        preserve_time: true


# 删除空文件夹
/DCIM
    action: clean

/Download
    action: clean

/Pictures
    action: clean
